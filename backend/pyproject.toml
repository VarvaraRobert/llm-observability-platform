[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-observability-backend"
version = "0.1.0"
description = "FastAPI + SQLAlchemy backend for the LLM Observability Platform (MVP)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "testcontainers[postgres]>=4.5",
]

[project.scripts]
lop-admin = "backend.admin:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
# Shared pytest configuration for the backend package.
# The repository-root pyproject-style config is intentionally duplicated per
# package so each component can be tested in isolation or from the repo root.
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
